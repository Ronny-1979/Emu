// LibretroDroid (GPL-3.0, Filippo Scognamiglio) als eigenes Modul. Gegenüber dem Original ergänzt:
// Run-Ahead und automatische Bildverzögerung (siehe src/main/cpp/runahead.h und framedelay.h).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = "com.swordfish.libretrodroid"
    compileSdk 35

    defaultConfig {
        minSdk 21

        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
