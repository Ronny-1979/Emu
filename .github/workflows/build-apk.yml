name: Build APK

# Baut die Debug-APK (wie BUILD_APK_WINDOWS.bat) und legt sie als GitHub-Release ab.
# Start: automatisch bei jedem Push auf main (außer reinen Doku-Änderungen) oder von Hand
# über Actions -> Build APK -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Der Emulator-Unterbau (libretrodroid) wird jetzt mitgebaut und braucht CMake.
      - name: CMake für den nativen Teil bereitstellen
        run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null || true

      - name: Version lesen
        id: ver
        run: echo "v=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      # Android aktualisiert eine installierte App nur, wenn Paketname UND Signatur gleich sind.
      # Ohne eigenes Debug-Zertifikat würde GitHub bei jedem Lauf einen Zufallsschlüssel erzeugen.
      - name: Eigenen Debug-Schlüssel einsetzen
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            cp ~/.android/debug.keystore "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Eigener Debug-Schlüssel aktiv"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 fehlt: Zufallsschlüssel, die APK kann eine bestehende Installation NICHT aktualisieren."
          fi

      - name: APK bauen
        run: sh gradlew assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk "PoloRetro_v${{ steps.ver.outputs.v }}_debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PoloRetro_v${{ steps.ver.outputs.v }}_debug
          path: PoloRetro_v${{ steps.ver.outputs.v }}_debug.apk

      - name: Release mit APK veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.v }}
        run: |
          FILE="PoloRetro_v${V}_debug.apk"
          if gh release view "v${V}" >/dev/null 2>&1; then
            gh release upload "v${V}" "$FILE" --clobber
          else
            gh release create "v${V}" "$FILE" --target "${GITHUB_SHA}" \
              --title "PoloRetro v${V}" \
              --notes "Debug-APK. Aktualisiert eine bestehende Installation nur, wenn Paketname und Signatur übereinstimmen (Secret DEBUG_KEYSTORE_BASE64). Änderungen siehe CHANGELOG.md."
          fi
